{% extends 'base.html' %}{% block content %}<div class="p-6 space-y-6 max-w-4xl"><div class="flex items-center justify-between border-b border-slate-200 pb-4"><div class="flex items-center gap-4"><h2 class="text-2xl font-extrabold">알림</h2><a class="button-outline" href="{{url_for('notification_settings')}}">알림 설정</a></div><form method="post" action="{{url_for('read_all')}}"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><button class="text-sm text-blue-600">모두 읽음</button></form></div><div class="border border-slate-200 rounded-2xl overflow-hidden">{% for n in notifications %}<form method="post" action="{{url_for('notification_open',nid=n.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><button class="notification-row {{'unread' if not n.is_read}}"><i data-lucide="{{'bell' if n.event_type=='match' else 'message-square'}}" class="w-5 h-5 text-blue-600"></i><span><b>{{n.body}}</b><small>{{n.created_at}}</small></span>{% if not n.is_read %}<span class="unread-dot"></span>{% endif %}</button></form>{% else %}<p class="p-8 text-slate-400">알림이 없습니다.</p>{% endfor %}</div></div>{% endblock %}

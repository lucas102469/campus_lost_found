<div class="location-fields" data-buildings='{{buildings|tojson}}'><label class="field-label">보관 위치 <span class="text-red-500">*</span></label><div class="flex gap-6 mb-3"><label class="flex items-center gap-2 text-sm"><input type="radio" name="storage_type" value="internal" {% if values.get('storage_type','internal')!='external' %}checked{% endif %}>건물 내부</label><label class="flex items-center gap-2 text-sm"><input type="radio" name="storage_type" value="external" {% if values.get('storage_type')=='external' %}checked{% endif %}>건물 외부</label></div><div data-internal class="grid grid-cols-2 gap-3 p-4 bg-white rounded-xl border border-slate-200 shadow-sm"><div><label class="small-label" for="building">건물 선택 <span class="text-red-500" aria-label="필수">*</span></label><select name="building" id="building" class="field small-field">{% for b in buildings %}<option {% if values.get('building','우당관')==b %}selected{% endif %}>{{b}}</option>{% endfor %}</select></div><div><label class="small-label" for="floor">층수 선택 <span class="text-red-500" aria-label="필수">*</span></label><select name="floor" id="floor" data-value="{{values.get('floor','1층')}}" class="field small-field"></select></div><div class="col-span-2"><label class="small-label" for="room">호실 <span class="text-red-500" aria-label="필수">*</span></label><input name="room" id="room" value="{{values.get('room') or ''}}" maxlength="60" class="field small-field" placeholder="호실을 입력해주세요 (예: 301호)"></div></div><div data-external class="space-y-3" hidden><button type="button" class="button-primary" data-gps>현재 위치로 등록</button><p class="text-xs text-slate-500" data-map-status>현재 위치 또는 지도에서 보관 위치를 지정해주세요.</p><div class="map-canvas" data-map data-editable="true"></div><div class="grid grid-cols-2 gap-3"><div><label class="small-label">위도 <span class="text-red-500" aria-label="필수">*</span></label><input class="field small-field" name="latitude" type="number" step="any" min="-90" max="90" value="{{values.get('latitude') or ''}}" aria-label="위도"></div><div><label class="small-label">경도 <span class="text-red-500" aria-label="필수">*</span></label><input class="field small-field" name="longitude" type="number" step="any" min="-180" max="180" value="{{values.get('longitude') or ''}}" aria-label="경도"></div></div><label class="small-label" for="location-note">위치 설명 <span class="text-red-500" aria-label="필수">*</span></label><input class="field" name="location_note" id="location-note" maxlength="500" value="{{values.get('location_note') or ''}}" placeholder="예: 캠퍼스 벤치 오른쪽 끝"></div></div>

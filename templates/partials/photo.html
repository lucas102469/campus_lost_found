{% set photos=gallery(item) %}{% if photos %}<div class="photo-gallery" data-gallery>{% for src in photos %}{% if item.photo_pos and loop.first %}<div class="sample-item-photo gallery-slide" style="background-image:url('{{src}}');background-position:{{item.photo_pos}}" role="img" aria-label="{{item.title}} 사진" {% if not loop.first %}hidden{% endif %}></div>{% else %}<img class="gallery-slide" src="{{src}}" alt="{{item.title}} 사진 {{loop.index}}" {% if not loop.first %}hidden{% endif %}>{% endif %}{% endfor %}{% if photos|length>1 %}<button type="button" class="gallery-arrow gallery-prev" data-gallery-step="-1" aria-label="이전 사진">&lt;</button><button type="button" class="gallery-arrow gallery-next" data-gallery-step="1" aria-label="다음 사진">&gt;</button>{% endif %}</div>{% else %}<div class="item-no-photo"><i data-lucide="image" class="w-8 h-8"></i><span>등록된 사진 없음</span></div>{% endif %}
